<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Stumble Beans</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1033; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #elim, #victory {
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: none; pointer-events: none; text-align: center; z-index: 10;
    background: #e8232b;
    border-top: 8px solid #1b1b1b; border-bottom: 8px solid #1b1b1b;
    box-shadow: 0 0 0 6px #ff6b6b inset;
    padding: 14px 0;
  }
  #elim span, #victory span {
    display: inline-block; font-family: 'Arial Black', 'Impact', system-ui, sans-serif;
    font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    font-size: clamp(34px, 8vw, 100px); color: #fff;
    -webkit-text-stroke: 14px #1b1b1b; paint-order: stroke fill;
    text-shadow: none;
  }
  #elim.show, #victory.show { display: block; animation: elimBand .25s ease-out; }
  #elim.show span, #victory.show span { animation: elimPop .7s cubic-bezier(.2,1.6,.4,1), elimShake .5s .7s ease-in-out 2; }
  @keyframes elimBand { from { opacity: 0; transform: translateY(-50%) scaleY(0); } to { opacity: 1; transform: translateY(-50%) scaleY(1); } }
  @keyframes elimPop { 0% { transform: scale(4) rotate(-12deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-3deg); } }
  @keyframes elimShake { 0%,100% { transform: rotate(-3deg) scale(1); } 25% { transform: rotate(2deg) scale(1.06); } 75% { transform: rotate(-5deg) scale(1.06); } }

  #victory { background: #2bbf4b; box-shadow: 0 0 0 6px #7dff9a inset; }
  /* ---------- Stoper i komunikat o podłodze ---------- */
  #timer {
    position: fixed; left: 50%; top: 2.5vmin; transform: translateX(-50%); z-index: 7; display: none; pointer-events: none;
    min-width: clamp(110px, 24vmin, 190px); text-align: center; box-sizing: border-box; padding: 4px 22px 8px;
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 3px; font-variant-numeric: tabular-nums;
    font-size: clamp(22px, 5.2vmin, 46px); color: #fff; -webkit-text-stroke: 9px #1b1b1b; paint-order: stroke fill;
    background: #3a7bff; border: 7px solid #1b1b1b; border-radius: 16px;
    box-shadow: 0 0 0 4px #8fb4ff inset, 0 7px 0 rgba(0,0,0,.35);
  }
  body:not(.menu) #timer { display: block; }
  #timer.warn { background: #e8232b; box-shadow: 0 0 0 4px #ff6b6b inset, 0 7px 0 rgba(0,0,0,.35); animation: timerPulse .5s ease-in-out infinite; }
  body.won #timer, body.elimd #timer { display: none !important; }
  @keyframes timerPulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.08); } }
  #toast { position: fixed; left: 0; right: 0; top: 18vmin; text-align: center; z-index: 7; display: none; pointer-events: none; }
  #toast span {
    display: inline-block; font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    font-size: clamp(20px, 5vmin, 44px); color: #ffd21f; -webkit-text-stroke: 10px #1b1b1b; paint-order: stroke fill;
  }
  #toast.show { display: block; animation: toastIn 3s both; }
  body.menu #toast { display: none !important; }
  @keyframes toastIn { 0% { opacity: 0; transform: scale(.4); } 8% { opacity: 1; transform: scale(1.15) rotate(-2deg); } 16% { transform: scale(1) rotate(-2deg); } 85% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- Sterowanie dotykowe ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 5; pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
  body.phone #touch { display: block; }
  body.elimd #touch { display: none; }
  body.won #touch { display: none; }
  #joy, #jumpBtn, #emoteBtn {
    position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%;
    background: rgba(255,255,255,.28); border: 7px solid #1b1b1b; box-sizing: border-box;
    box-shadow: 0 0 0 5px rgba(255,255,255,.85) inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #joy { left: 5vmin; bottom: 8vmin; width: clamp(130px, 32vmin, 220px); height: clamp(130px, 32vmin, 220px); }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%;
    background: #fff; border: 8px solid #1b1b1b; box-sizing: border-box; box-shadow: 0 5px 0 rgba(0,0,0,.35); pointer-events: none;
  }
  #jumpBtn { right: 6vmin; bottom: 10vmin; width: clamp(110px, 28vmin, 190px); height: clamp(110px, 28vmin, 190px); transition: transform .08s; }
  #jumpBtn.down { transform: scale(.9); background: rgba(255,255,255,.5); }
  #jumpBtn svg { position: absolute; inset: 14%; width: 72%; height: 72%; pointer-events: none; }
  #jumpBtn path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #jumpBtn .o { stroke: #1b1b1b; stroke-width: 22; }
  #jumpBtn .i { stroke: #fff; stroke-width: 11; }
  /* ---------- Menu główne ---------- */
  #menu { position: fixed; inset: 0; display: none; z-index: 8; pointer-events: none; }
  body.menu #menu { display: block; }
  body.menu #touch { display: none; }
  #playBtn {
    position: absolute; right: 5vmin; bottom: 6vmin; pointer-events: auto; cursor: pointer;
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
    font-size: clamp(30px, 7vmin, 64px); color: #fff; -webkit-text-stroke: 10px #1b1b1b; paint-order: stroke fill;
    background: #ffd21f; border: 8px solid #1b1b1b; border-radius: 18px; padding: 10px 44px;
    box-shadow: 0 0 0 5px #fff18a inset, 0 8px 0 rgba(0,0,0,.35);
    transition: transform .08s; touch-action: manipulation;
  }
  #playBtn:hover { background: #ffe14d; }
  #playBtn:active { transform: scale(.92); }

  /* ---------- Nick nad fasolką ---------- */
  #nameplate {
    position: fixed; left: 0; top: 0; z-index: 6; pointer-events: none; white-space: nowrap; transform: translate(-9999px, -9999px);
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 2px;
    font-size: 26px; color: #fff; -webkit-text-stroke: 7px #1b1b1b; will-change: transform; paint-order: stroke fill;
  }
  body.profile #nameplate, body.elimd #nameplate { display: none !important; }

  /* ---------- Profilowe (lewy górny róg menu) ---------- */
  #profileBtn {
    position: absolute; left: 3vmin; top: 3vmin; pointer-events: auto; cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; gap: 12px; padding: 0; background: none; border: 0; transition: transform .08s;
  }
  #profileBtn { pointer-events: none; }                 /* nick obok profilowego jest nieklikalny i bez hovera */
  #profileBtn .avatar { transition: transform .08s; pointer-events: auto; cursor: pointer; }
  #profileName { pointer-events: none; }
  #profileBtn:hover .avatar { transform: scale(1.05); }   /* animacja tylko na profilowym, nick stoi w miejscu */
  #profileBtn:active .avatar { transform: scale(.93); }
  .avatar {
    position: relative; border-radius: 50%; box-sizing: border-box; overflow: hidden; flex: none;
    background: #0b1033; isolation: isolate;
    box-shadow: 0 6px 0 rgba(0,0,0,.35);
  }
  /* obrys rysowany NA wierzchu canvasa, żeby przy hoverze/skalowaniu nic spod niego nie prześwitywało */
  .avatar::after {
    content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 9px solid #1b1b1b; box-sizing: border-box;
    box-shadow: 0 0 0 4px #fff inset; pointer-events: none; z-index: 2;
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  #profileBtn .avatar { width: clamp(64px, 14vmin, 110px); height: clamp(64px, 14vmin, 110px); }
  #profileName {
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 2px;
    font-size: clamp(16px, 3.4vmin, 30px); color: #fff; -webkit-text-stroke: 7px #1b1b1b; paint-order: stroke fill;
    max-width: 40vw; overflow: visible; white-space: nowrap; padding: 6px 10px 6px 4px;   /* overflow:hidden ucinał obrys litery B z lewej */
  }

  body.profile #menu { display: none; }
  /* ---------- Ekran profilu (3D fasolka + niebo w tle) ---------- */
  #profile {
    position: fixed; inset: 0; z-index: 9; display: none; overflow: hidden; pointer-events: none;
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  body.profile #profile { display: block; }
  .pbtn {
    pointer-events: auto; cursor: pointer; touch-action: manipulation; font-family: inherit; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    color: #fff; -webkit-text-stroke: 8px #1b1b1b; paint-order: stroke fill;
    border: 7px solid #1b1b1b; border-radius: 16px; transition: transform .08s;
  }
  .pbtn:active { transform: scale(.92); }
  #saveBtn { font-size: clamp(18px, 4vmin, 34px); padding: 6px 26px; background: #2bbf4b; box-shadow: 0 0 0 4px #7dff9a inset, 0 7px 0 rgba(0,0,0,.35); }
  #saveBtn:hover { background: #3ad65c; }
  #backBtn {
    position: absolute; left: 3vmin; top: 3vmin; padding: 0; border-radius: 50%; box-sizing: border-box;
    width: clamp(56px, 12vmin, 92px); height: clamp(56px, 12vmin, 92px);
    background: #e8232b; box-shadow: 0 0 0 5px #ff6b6b inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #backBtn:hover { background: #ff3b43; }
  #backBtn svg { position: absolute; inset: 14%; width: 72%; height: 72%; pointer-events: none; }
  #backBtn path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #backBtn .o { stroke: #1b1b1b; stroke-width: 22; }
  #backBtn .i { stroke: #fff; stroke-width: 11; }
  #pwrap {
    position: absolute; right: 3vw; top: 0; bottom: 0; width: 52vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
  }
  body.profile #pwrap { animation: pIn .55s .45s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  @media (max-aspect-ratio: 1/1) {
    #pwrap { left: 0; right: 0; top: auto; bottom: 5vh; width: auto; }
  }
  #nickRow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #nickInput {
    pointer-events: auto; font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; letter-spacing: 2px;
    font-size: clamp(18px, 4vmin, 34px); color: #1b1b1b; text-align: center; width: clamp(180px, 40vmin, 320px);
    background: #fff; border: 7px solid #1b1b1b; border-radius: 16px; padding: 6px 12px; box-sizing: border-box;
    box-shadow: 0 0 0 4px #d8d8ff inset, 0 7px 0 rgba(0,0,0,.35); outline: none;
  }
  #nickInput:focus, #nickInput:active, #nickInput:-webkit-autofill { background: #fff; -webkit-box-shadow: 0 0 0 4px #d8d8ff inset, 0 7px 0 rgba(0,0,0,.35), 0 0 0 100px #fff inset; }
  #stats { display: flex; gap: 2.5vmin; flex-wrap: wrap; justify-content: center; }
  .stat {
    min-width: clamp(100px, 22vmin, 180px); text-align: center; padding: 8px 14px 12px; box-sizing: border-box;
    background: #e8232b; border: 7px solid #1b1b1b; border-radius: 16px; color: #fff;
    box-shadow: 0 0 0 4px #ff6b6b inset, 0 7px 0 rgba(0,0,0,.35);
  }
  .stat.w { background: #2bbf4b; box-shadow: 0 0 0 4px #7dff9a inset, 0 7px 0 rgba(0,0,0,.35); }
  .stat.r { background: #3a7bff; box-shadow: 0 0 0 4px #8fb4ff inset, 0 7px 0 rgba(0,0,0,.35); }
  .stat .l { font-size: clamp(12px, 2.6vmin, 22px); letter-spacing: 2px; -webkit-text-stroke: 6px #1b1b1b; paint-order: stroke fill; }
  .stat .v { font-size: clamp(28px, 7vmin, 60px); -webkit-text-stroke: 9px #1b1b1b; paint-order: stroke fill; }

  /* ---------- Ustawienia ---------- */
  #setBtn, #setBack {
    position: absolute; padding: 0; border-radius: 50%; box-sizing: border-box; top: 3vmin;
    width: clamp(56px, 12vmin, 92px); height: clamp(56px, 12vmin, 92px);
  }
  #setBtn { right: calc(3vmin + clamp(56px, 12vmin, 92px) + 2vmin); background: #3a7bff; box-shadow: 0 0 0 5px #8fb4ff inset, 0 6px 0 rgba(0,0,0,.35); }
  #setBtn:hover { background: #5590ff; }
  #setBack { left: 3vmin; background: #e8232b; box-shadow: 0 0 0 5px #ff6b6b inset, 0 6px 0 rgba(0,0,0,.35); }
  #setBack:hover { background: #ff3b43; }
  #setBtn svg, #setBack svg { position: absolute; inset: 14%; width: 72%; height: 72%; pointer-events: none; }
  #setBtn path, #setBack path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #setBtn svg { overflow: visible; }
  #setBtn .o, #setBack .o { stroke: #1b1b1b; stroke-width: 22; }
  #setBtn .i, #setBack .i { stroke: #fff; stroke-width: 11; }
  #setBtn path { fill-rule: evenodd; }
  #setBtn .o { fill: #1b1b1b; stroke: #1b1b1b; stroke-width: 11; stroke-linejoin: round; }
  #setBtn .i { fill: #fff; stroke: none; }
  /* ---------- Customize (przycisk w menu) ---------- */
  #custBtn {
    --cs: clamp(64px, 14vmin, 110px);
    position: absolute; left: 3vmin; top: calc(50% - var(--cs) / 2 + 9vmin); padding: 0; border-radius: 50%; box-sizing: border-box;
    width: var(--cs); height: var(--cs); background: #3a7bff; box-shadow: 0 0 0 5px #8fb4ff inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #custBtn:hover { background: #5590ff; }
  /* ---------- Shop (przycisk nad Customize) ---------- */
  #shopBtn {
    --cs: clamp(64px, 14vmin, 110px);
    position: absolute; left: 3vmin; top: calc(50% - var(--cs) / 2 + 9vmin - var(--cs) - 2.5vmin); padding: 0; border-radius: 50%; box-sizing: border-box;
    width: var(--cs); height: var(--cs); background: #3a7bff; box-shadow: 0 0 0 5px #8fb4ff inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #shopBtn:hover { background: #5590ff; }
  #shopBtn svg { position: absolute; inset: 0; margin: auto; width: calc(var(--cs) - 30px); height: calc(var(--cs) - 30px); overflow: visible; pointer-events: none; }
  #shopBtn .d { fill: none; stroke: #1b1b1b; stroke-width: 17; stroke-linejoin: round; stroke-linecap: round; }
  #shopBtn .b { fill: #1b1b1b; stroke: #1b1b1b; stroke-width: 9; stroke-linejoin: round; }
  #shopBtn .w { fill: none; stroke: #fff; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
  #shopBtn .bw { fill: #fff; stroke: #fff; stroke-width: 1; stroke-linejoin: round; }
  #shopBtn .dc { fill: #1b1b1b; stroke: none; }
  #shopBtn .wc { fill: #fff; stroke: none; }
  #nameplate span, #profileName span { color: inherit; }
  #custBtn svg { position: absolute; inset: 0; margin: auto; width: calc(var(--cs) - 30px); height: calc(var(--cs) - 30px); overflow: visible; pointer-events: none; }   /* ikona mieści się w środku jasnoniebieskiego obrysu */
  #custBtn .o { fill: #1b1b1b; stroke: #1b1b1b; stroke-width: 9; stroke-linejoin: round; }
  #custBtn .i { fill: #fff; stroke: none; }

  /* ---------- Shop (ekran jak Ustawienia) ---------- */
  #shop {
    position: fixed; inset: 0; z-index: 9; display: none; overflow: auto; background: rgba(11,16,51,.88);
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  body.shop #shop { display: block; }
  body.shop #menu { display: none; }
  #shop, #shop * { stroke-linejoin: round; stroke-linecap: round; text-rendering: geometricPrecision; }
  #prevBack { display: none; }
  body.preview #shop { display: none; }
  body.preview #prevBack { display: block; }
  #shopBack, #prevBack, #lbBack {
    position: absolute; padding: 0; border-radius: 50%; box-sizing: border-box; top: 3vmin; left: 3vmin;
    width: clamp(56px, 12vmin, 92px); height: clamp(56px, 12vmin, 92px);
    background: #e8232b; box-shadow: 0 0 0 5px #ff6b6b inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #shopBack:hover, #prevBack:hover, #lbBack:hover { background: #ff3b43; }
  #shopBack svg, #prevBack svg, #lbBack svg { position: absolute; inset: 14%; width: 72%; height: 72%; pointer-events: none; }
  #shopBack path, #prevBack path, #lbBack path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #shopBack .o, #prevBack .o, #lbBack .o { stroke: #1b1b1b; stroke-width: 22; }
  #shopBack .i, #prevBack .i, #lbBack .i { stroke: #fff; stroke-width: 11; }
  #shopTop {
    position: absolute; right: 3vmin; display: flex; align-items: center; gap: clamp(8px, 1.8vmin, 16px);
    top: calc(3vmin + (clamp(56px, 12vmin, 92px) - clamp(44px, 9vmin, 70px)) / 2);
  }
  #gemHelp {
    flex: none; padding: 0; border-radius: 50%; box-sizing: border-box; line-height: 1; display: flex; align-items: center; justify-content: center;
    position: relative; width: clamp(44px, 9vmin, 70px); height: clamp(44px, 9vmin, 70px);
    background: #3a7bff; box-shadow: 0 0 0 4px #8fb4ff inset, 0 6px 0 rgba(0,0,0,.35);
  }
  #gemHelp:hover { background: #5590ff; }
  #gemHelp svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #gemHelp text { font-family: 'Arial Black', 'Impact', system-ui, sans-serif; font-weight: 900; font-size: 40px; fill: #fff; stroke: #1b1b1b; stroke-width: 9px; paint-order: stroke fill; stroke-linejoin: round; text-transform: none; }
  #shopGems, #shopCarrots {
    box-sizing: border-box; display: flex; align-items: center; gap: 10px;
    height: clamp(44px, 9vmin, 70px);
    padding: 0 18px; background: #3a7bff; border: 7px solid #1b1b1b; border-radius: 16px;
    box-shadow: 0 0 0 4px #8fb4ff inset, 0 7px 0 rgba(0,0,0,.35);
    font-size: clamp(18px, 4vmin, 32px); letter-spacing: 2px; color: #fff; -webkit-text-stroke: 7px #1b1b1b; paint-order: stroke fill;
  }
  .gem { width: 1.3em; height: 1.3em; flex: none; overflow: visible; }
  #shopPanel {
    /* wyśrodkowane w miejscu POD górnym paskiem (Back / ? / gemy), żeby zakładki nie wchodziły na guziki */
    position: absolute; left: 50%; top: calc(50% + (3vmin + clamp(56px, 12vmin, 92px)) / 2); transform: translate(-50%, -50%); width: min(96vw, 720px);
    display: flex; flex-direction: column; align-items: center; gap: 2vmin;
  }
  #creatorBox { width: 100%; display: flex; flex-direction: column; gap: 2vmin; align-items: stretch; }
  #creatorBox[hidden], #crActive[hidden] { display: none; }
  .crText { text-align: center; color: #fff; -webkit-text-stroke: 6px #1b1b1b; paint-order: stroke fill; letter-spacing: 2px; font-size: clamp(13px, 2.8vmin, 21px); line-height: 1.35; }
  .crBig { font-size: clamp(22px, 5.4vmin, 44px); -webkit-text-stroke: 8px #1b1b1b; }
  #crForm { gap: clamp(8px, 2vmin, 16px); }
  #crInput {
    pointer-events: auto; flex: 1; min-width: 0; font-family: inherit; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    font-size: clamp(18px, 4vmin, 32px); color: #1b1b1b; text-align: center; background: #fff; border: 7px solid #1b1b1b; border-radius: 16px;
    padding: 6px 12px; box-sizing: border-box; box-shadow: 0 0 0 4px #d8d8ff inset, 0 5px 0 rgba(0,0,0,.35); outline: none;
  }
  #crInput:-webkit-autofill { -webkit-box-shadow: 0 0 0 4px #d8d8ff inset, 0 0 0 100px #fff inset; }
  #crActive { flex-direction: column; justify-content: center; gap: 4px; padding: 14px 18px 18px; }
  .crStar { width: clamp(34px, 8vmin, 60px); height: clamp(34px, 8vmin, 60px); overflow: visible; }
  #crActive .tog { margin-top: 8px; }
  .shopItem { width: 100%; gap: clamp(10px, 2.4vmin, 20px); padding: 12px 18px; }
  #shopList { width: 100%; display: flex; flex-direction: column; gap: 2vmin; min-height: 26vmin; max-height: calc(100vh - 3vmin - clamp(56px, 12vmin, 92px) - 2 * (clamp(12px, min(3.6vmin, 3.6vw), 28px) * 1.2 + 30px) - 12vmin); overflow-y: auto; overflow-x: hidden; padding: 0 0 12px; scrollbar-width: none; }
  #shopList::-webkit-scrollbar { display: none; }
  #shopList .row { flex: none; }
  .shopView {
    position: relative; flex: none; width: clamp(72px, 17vmin, 130px); height: clamp(72px, 17vmin, 130px);
    pointer-events: none;
  }
  .shopView canvas { display: block; width: 100%; height: 100%; }
  .itemInfo { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .itemName { font-size: clamp(18px, 4.2vmin, 34px); color: #fff; -webkit-text-stroke: 8px #1b1b1b; paint-order: stroke fill; letter-spacing: 2px; white-space: nowrap; }
  .itemPrice { display: flex; align-items: center; gap: 8px; font-size: clamp(16px, 3.6vmin, 28px); color: #fff; -webkit-text-stroke: 7px #1b1b1b; paint-order: stroke fill; letter-spacing: 2px; }
  .buyBtn { font-size: clamp(18px, 4vmin, 32px); }

  #gemInfo { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; background: rgba(11,16,51,.78); }
  #gemInfo.show { display: flex; }
  #gemCard { width: min(92vw, 520px); display: flex; flex-direction: column; align-items: center; gap: 2.6vmin; animation: pIn .3s cubic-bezier(.2,1.4,.4,1) both; }

  /* ---------- Emotka: slot na PC (prawy środek) i guzik na telefonie ---------- */
  #emoteSlot {

    width: clamp(84px, 17vmin, 140px); aspect-ratio: 1; box-sizing: border-box; overflow: hidden;

  .row input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; min-width: 120px; max-width: none; height: 16px; margin: 9px 27px; padding: 0; box-sizing: border-box;
    border-radius: 10px; box-shadow: 0 0 0 4px #1b1b1b; cursor: pointer; --f: .5;

  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -9px; box-sizing: border-box; border-radius: 50%; background: #ffd21f; border: 6px solid #1b1b1b; box-shadow: 0 0 0 3px #fff18a inset, 0 4px 0 rgba(0,0,0,.35); transition: transform .08s; }

  /* suwaki w stylu gry: gruby czarny obrys, żółte wypełnienie, żółta gałka */

  /* gładkie obrysy tekstu: zaokrąglone łączenia zamiast ostrych "kolców" w literach */
  #elim span, #victory span, #timer, #toast span, #playBtn, #nameplate, #profileName, .stat .l, .stat .v, #profile, #profile * {
    stroke-linejoin: round; stroke-linecap: round; text-rendering: geometricPrecision;
  }

// muzyka: wesoła pętla C - Am - F - G (menu spokojniejsze, w grze szybsza z perkusją)
const ROOT = [48, 45, 41, 43];

const MEL = [
  [76, 0, 79, 0, 76, 74, 72, 0],
  [69, 0, 72, 0, 76, 0, 74, 72],
  [72, 0, 77, 0, 74, 72, 69, 0],
  [74, 0, 79, 0, 76, 74, 71, 0]

const BASSP = { 0: 0, 2: 12, 3: 0, 4: 0, 6: 12, 7: 7 };
let mStep = 0, mLoop = 0, mNext = 0;
function musicStep(t, game) {
  const bar = (mStep >> 3) & 3, s = mStep & 7, dur = 60 / (game ? 134 : 112) / 2;
  if (s & 1) t += dur * 0.14;   // lekki swing = bardziej skoczne
  const bus = musicBus;
  if (s in BASSP) tone(mtof(ROOT[bar] + BASSP[s]), t, dur * 0.9, { type: 'square', vol: 0.22, lp: 520, a: 0.008, bus });
  if (s === 2 || s === 6) CHORD[bar].forEach(n => tone(mtof(n), t, dur * 0.8, { type: 'square', vol: game ? 0.06 : 0.04, lp: 2200, bus }));
  const m = MEL[bar][s];
  if (m) {   // "marimba"
    const mm = game && (mLoop & 1) ? m + 12 : m, f = mtof(mm);
    tone(f, t, 0.32, { vol: 0.5, a: 0.003, bus });

    if (s === 0 || s === 4) { tone(150, t, 0.14, { to: 45, vol: 0.6, bus }); }
    if (s === 2 || s === 6) { noise(t, 0.12, { f: 1800, q: 0.7, vol: 0.28, bus }); tone(190, t, 0.08, { type: 'triangle', vol: 0.2, bus }); }

// ---------- Scena ----------
const scene = new THREE.Scene();

// ---------- Gwiazdy ----------
const stars = (function makeStars() {
  const N = 1100, arr = new Float32Array(N * 3), r = 220;   // mniej gwiazdek niż wcześniej (było 1600)
  const MIN_COS = Math.cos(1.5 * Math.PI / 180);            // min. odstęp 1.5° między gwiazdkami, żeby nie nachodziły na siebie
  let n = 0;
  for (let tries = 0; n < N && tries < N * 60; tries++) {
    const u = Math.random() * Math.PI * 2, v = Math.random() * 2 - 1;   // cała sfera (góra i dół)
    const s = Math.sqrt(1 - v * v), x = Math.cos(u) * s, y = v, z = Math.sin(u) * s;
    let ok = true;
    for (let j = 0; j < n; j++) if (x * arr[j * 3] + y * arr[j * 3 + 1] + z * arr[j * 3 + 2] > MIN_COS) { ok = false; break; }
    if (!ok) continue;
    arr[n * 3] = x; arr[n * 3 + 1] = y; arr[n * 3 + 2] = z; n++;
  }
  for (let i = 0; i < n * 3; i++) arr[i] *= r;   // jednostkowe wektory -> sfera o promieniu r
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr.slice(0, n * 3), 3));   // tylko faktycznie wylosowane gwiazdki
  const m = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.9, depthWrite: false });
  const p = new THREE.Points(g, m);

  scene.add(p);
  return p;
})();
sun.position.set(30, 50, 20);

const TILE_R = 2.8, TILE_GAP = 0.96, TILE_H = 0.5, RINGS0 = 8;   // promień kafelka, grubość (płaska podłoga), liczba pierścieni

(function makeFloor() {

    mesh.position.set(x, -TILE_H / 2, z); mesh.receiveShadow = true; scene.add(mesh);
    const t = { q, r, x, z, ring, mesh, mats, shared: tileTopMats[ci], base: new THREE.Color(TOP_COLS[ci]), own: null,

function ensureOwn(t) { if (!t.own) { t.own = t.shared.clone(); t.ownSide = tileSideMat.clone(); t.mesh.material = [t.ownSide, t.own, t.ownSide]; } }

// kafelek robi się cały czerwony, trzęsie i lekko zapada (po dotknięciu i przy zmniejszaniu podłogi)
function applyRed(t, k) {
  const m = t.mesh, e = k * k * (3 - 2 * k), c = Math.min(1, k * 3);
  t.own.color.copy(t.base).lerp(HONEY_COL, c);
  t.own.emissive.copy(HONEY_COL).multiplyScalar(0.22 * c);
  t.ownSide.color.copy(SIDE_BASE).lerp(SIDE_RED, c);
  t.ownSide.emissive.copy(HONEY_COL).multiplyScalar(0.22 * c);
  t.dy = -0.16 * e;

let _hq = 0, _hr = 0;

let authSeq = 0;
async function onAuth(user) {
  if (user && user.isAnonymous) return;   // anonimowe konto gościa (tylko do rankingu) to dalej "not connected"
  const my = ++authSeq;
  if (!user) {                       // logged out -> back to the not connected profile (or a new one)
    const was = acct; acct = null;
    try { localStorage.removeItem(CLOUD_KEY); } catch (err) {}
    if (was) { loadGuest(); refreshProfileUI(); }
    pushGuestLb();                   // gość z wygranymi trafia do topki
    return;
  }
  const hadCache = !!acct;
  acct = user;
  const ref = fbDb.collection('users').doc(user.uid);
  let snap;
  try { snap = await ref.get(); }
  catch (err) { if (!hadCache && my === authSeq) { acct = null; fbAuth.signOut().catch(() => {}); } return; }
  if (my !== authSeq) return;
  if (snap.exists) {                 // account already has data -> log in to it (the guest profile stays untouched)
    applyProfile(snap.data()); cacheSave();
  } else {                           // new account -> it takes over the current guest profile
    const g = readGuest();
    let nick = g.nick;
    if (nick) { try { await claimNick(nick, null, user.uid); } catch (err) { if (err.message === 'taken') nick = ''; } }
    if (!nick) nick = await freshNick(user.uid);
    if (my !== authSeq) return;
    const keep = { nick, wins: g.wins, losses: g.losses, settings: g.settings, owned: g.owned, equip: g.equip, gems: g.gems, carrots: g.carrots, emotes: g.emotes, emEquip: g.emEquip, steps: g.steps, stEquip: g.stEquip, creator: g.creator || null, controls: g.controls };
    applyProfile(keep);
    try { await ref.set(snapshot()); clearGuest(); cacheSave(); }
    catch (err) { acct = null; fbAuth.signOut().catch(() => {}); applyProfile(g); refreshProfileUI(); return; }
  }
  refreshProfileUI();
  claimCreatorGems(); flushCreatorQueue();
}

const CR_Q = 'stumbleBeansCreatorQueue';
const crQueue = () => { try { return JSON.parse(localStorage.getItem(CR_Q)) || []; } catch (err) { return []; } };

let crFlushing = false;
async function flushCreatorQueue() {
  if (crFlushing || !fbDb) return; crFlushing = true;
  try {
    while (crQueue().length) {
      const it = crQueue()[0], inc = firebase.firestore.FieldValue.increment;
      await fbDb.collection('creators').doc(nickKey(it.nick)).set({ nick: it.nick, pending: inc(it.n), total: inc(it.n) }, { merge: true });
      const q = crQueue(); q.shift(); crQueueSave(q);
    }
  } catch (err) {} finally { crFlushing = false; }
}

let crClaiming = false;

  if (!acct || !fbDb || !playerNick || crClaiming) return; crClaiming = true;
  try {
    const ref = fbDb.collection('creators').doc(nickKey(playerNick));
    const n = await fbDb.runTransaction(async tx => {
      const s = await tx.get(ref), p = s.exists ? (s.data().pending | 0) : 0;
      if (p > 0) tx.update(ref, { pending: 0 });
      return p;
    });

  } catch (err) {} finally { crClaiming = false; }
}

  // kierunek względem kamery
  let ix = (keys[binds.right] ? 1 : 0) - (keys[binds.left] ? 1 : 0);
  let iz = (keys[binds.fwd] ? 1 : 0) - (keys[binds.back] ? 1 : 0);
  ix += joy.x; iz += joy.y;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const wish = new THREE.Vector3().addScaledVector(fwd, iz).addScaledVector(right, ix);
  const hasInput = !won && wish.lengthSq() > 0.04;   // martwa strefa joysticka
  if (hasInput) wish.normalize();
  if (won) { jumpBuffer = 0; diveBuffer = 0; }   // po wygranej fasolka po prostu stoi (bez kręcenia)
  emoteCd = Math.max(0, emoteCd - dt);
  if (emoteT >= 0) {   // emotkę przerywa ruch, skok, dive albo utrata gruntu
    emoteT += dt;
    if (hasInput || jumpBuffer > 0 || diveBuffer > 0 || diving || !grounded || won || emoteT >= EMOTE_TIME) { emoteT = -1; sfx.emoteStop(); }
  }
  if (bubbleT >= 0) { bubbleT += dt; if (bubbleT >= BUBBLE_TIME) bubbleT = -1; }   // chmurka nie przerywa się ruchem

  // dive
  diveCooldown -= dt;
  diveBuffer -= dt;
  if (diveBuffer > 0 && diveCooldown <= 0) {
    diveBuffer = 0;
    {
    diveCooldown = DIVE_COOLDOWN;
    diving = true; diveTimer = DIVE_TIME; jumpBuffer = 0; sfx.dive();
    vel.x = Math.sin(facing) * DIVE_SPEED;
    vel.z = Math.cos(facing) * DIVE_SPEED;
    vel.y = grounded ? 6 : Math.min(vel.y, 2);
    grounded = false;
    }
  }
  if (diving) {
    diveTimer -= dt;
    if (grounded) {   // ślizg po ziemi
      const sp = Math.hypot(vel.x, vel.z);
      const drop = Math.min(sp, 14 * dt);
      if (sp > 0) { vel.x -= vel.x / sp * drop; vel.z -= vel.z / sp * drop; }
    }
    if (diveTimer <= 0) diving = false;
  }

  // przyspieszanie / tarcie
  const control = grounded ? 1 : AIR_CONTROL;
  if (diving) {
    // brak sterowania podczas dive'a
  } else if (hasInput) {
    vel.x += wish.x * ACCEL * control * dt;
    vel.z += wish.z * ACCEL * control * dt;
    facing = angleLerp(facing, Math.atan2(wish.x, wish.z), dt * 14);
  } else if (grounded) {
    const sp = Math.hypot(vel.x, vel.z);
    const drop = Math.min(sp, FRICTION * dt);
    if (sp > 0) { vel.x -= vel.x / sp * drop; vel.z -= vel.z / sp * drop; }
  }
  const hs = Math.hypot(vel.x, vel.z);
  const maxSp = diving ? DIVE_SPEED : MAX_SPEED;
  if (hs > maxSp) { vel.x *= maxSp / hs; vel.z *= maxSp / hs; }

  // skok (z buforem i coyote time)
  jumpBuffer -= dt;
  coyote = grounded ? 0.1 : coyote - dt;
  if (!diving && jumpBuffer > 0 && coyote > 0) {
    vel.y = JUMP_V; grounded = false; coyote = 0; jumpBuffer = 0; squash = -0.25; sfx.jump();
  }

  // grawitacja
  vel.y -= GRAVITY * dt;
  const prevY = pos.y;
  pos.addScaledVector(vel, dt);

  // lądowanie na podłodze
  groundH += ((diving ? DIVE_HEIGHT : HALF_H) - groundH) * Math.min(1, dt * 12);

  // ściany boczne kafelków + lądowanie na kafelku (który może się lekko zapadać)
  tileWalls();
  const fh = floorTopAt(pos.x, pos.z), onFloor = fh !== null;
  const G = (onFloor ? fh : 0) + groundH;   // wysokość środka fasolki, gdy stoi na kafelku
  if (onFloor && vel.y <= 0 && pos.y <= G + (grounded ? 0.3 : 0) && (grounded || prevY >= fh + DIVE_HEIGHT - 0.1)) {
    if (!grounded) {
      if (vel.y < -3) sfx.land(-vel.y);
      if (vel.y < -6) squash = Math.min(0.35, -vel.y * 0.02);
    }
    if (grounded && Math.abs(G - pos.y) < 0.4) visOff -= (G - pos.y);   // mały uskok między kafelkami: tylko wizualnie wygładzamy
    pos.y = G; vel.y = 0; grounded = true;
  } else if (pos.y > G + 0.01 || !onFloor) {
    grounded = false;
  }
  // dotknięty kafelek (pod fasolką albo tuż obok) zaczyna się robić miodowy
  if (grounded && !won && gameT > START_GRACE) {
    touchTile(tileAtXZ(pos.x, pos.z));
    touchTile(tileAtXZ(pos.x + 0.5, pos.z)); touchTile(tileAtXZ(pos.x - 0.5, pos.z));
    touchTile(tileAtXZ(pos.x, pos.z + 0.5)); touchTile(tileAtXZ(pos.x, pos.z - 0.5));
  }

  // dźwięki: kroki i gwizd spadania
  if (grounded && !diving && hs > 2) { stepAcc += hs * dt; if (stepAcc > 2.6) { stepAcc = 0; sfx.step(); } }
  else if (!grounded) stepAcc = 1.5;
  if (equipStep && grounded && !diving && !won && hs > 2) { trailAcc += dt * STEP_RATE * Math.min(1, hs / MAX_SPEED); while (trailAcc >= 1) { trailAcc -= 1; spawnStepHeart(); } }   // serca wypadają ze stóp, im szybciej biegniesz, tym gęściej
  else trailAcc = 0;
  if (pos.y < -8 && !fallSnd) { fallSnd = true; sfx.fall(); }

  // respawn po spadnięciu
  if (pos.y < FALL_LIMIT) {
    if (won) { respawn(); return; }
    eliminated = true; stats.losses++; saveStats(); renderStats();
    elimTimer = ELIM_TIME; sfx.elim(); musicDuck(true);
    document.body.classList.add('elimd');      // schowaj guziki
    joyReset(); camId = null; jumpEl.classList.remove('down');
    elimEl.classList.remove('show'); void elimEl.offsetWidth; elimEl.classList.add('show');
  }

  // wygląd: pochylenie w stronę ruchu + ściskanie
  const lean = Math.min(hs / MAX_SPEED, 1) * 0.35;
  const localVx = vel.x * Math.cos(facing) - vel.z * Math.sin(facing);
  tilt.x += ((diving ? 1.45 : (hs > 0.1 ? lean : 0)) - tilt.x) * Math.min(1, dt * 14);
  tilt.y += (-localVx * 0.02 - tilt.y) * Math.min(1, dt * 8);
  squash += (0 - squash) * Math.min(1, dt * 12);
  const stretchAir = grounded ? 0 : Math.max(-0.1, Math.min(0.15, vel.y * 0.01));

  visOff *= Math.exp(-dt * 14);
  bean.position.copy(pos); bean.position.y += visOff;
  bean.rotation.set(tilt.x, facing, tilt.y, 'YXZ');
  let sqv = squash;
  if (emoteT >= 0) { const p = emotePose(emoteT); bean.position.y += p.y; bean.rotation.set(p.rx, facing, p.rz, 'YXZ'); sqv = p.sq; }
  body.scale.set(1 + sqv * 0.6 - stretchAir * 0.3, STRETCH * (1 - sqv + stretchAir), 0.9 + sqv * 0.6);
  if (bubbleT >= 0 && !eliminated && !inMenu) {   // chmurka z emotką nad głową: wyskakuje, wisi, na końcu się chowa
    const a = Math.min(1, bubbleT / 0.25), pop = 1 + 2.70158 * Math.pow(a - 1, 3) + 1.70158 * Math.pow(a - 1, 2), out = Math.min(1, (BUBBLE_TIME - bubbleT) / 0.25);
    gameBubble.visible = true; let bLift = beanById(equipBean).ears ? 0.62 : 0.14;
    if (settings.nick) {   // nick włączony: chmurka wisi nad napisem (nick ma stały rozmiar w px, więc przeliczamy jego wysokość na jednostki świata)
      const wpp = 2 * camera.position.distanceTo(bean.position) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / innerHeight;
      bLift = Math.max(bLift, 50 * wpp);
    }
    gameBubble.position.set(bean.position.x, bean.position.y + HALF_H + bLift, bean.position.z);
    gameBubble.scale.setScalar(BUBBLE_SIZE * Math.max(0.001, pop * out));
  } else { gameBubble.visible = false; if (bubbleT >= 0) bubbleT = -1; }

  // kamera trzecioosobowa
  const dist = 8;
  // wygładzona wysokość kamery: małe uskoki między kafelkami nie szarpią widokiem
  let cd = pos.y - camBaseY;
  if (Math.abs(cd) > 0.6) camBaseY = pos.y - Math.sign(cd) * 0.6;
  camBaseY += (pos.y - camBaseY) * Math.min(1, dt * 7);
  const target = new THREE.Vector3(pos.x, camBaseY + 1.2, pos.z);
  const camPos = new THREE.Vector3(
    target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
    target.y + Math.sin(pitch) * dist,
    target.z + Math.cos(yaw) * Math.cos(pitch) * dist
  );
  camPos.y = Math.max(camPos.y, 0.5);
  camera.position.lerp(camPos, Math.min(1, dt * 12));
  camera.lookAt(target);

  // gwiazdy zawsze wokół kamery (nieskończenie daleko)
  stars.position.copy(camera.position);

  // cień podąża za graczem
  sun.position.set(pos.x + 30, 50, pos.z + 20);
  sun.target.position.set(pos.x, 0, pos.z);
}

// Gra działa też w tle: gdy karta jest ukryta przeglądarka zatrzymuje requestAnimationFrame,
// więc wtedy symulację popycha timer z Web Workera (nie jest tak dławiony jak zwykły setInterval).
let lastT = performance.now();
function advance() {
  const now = performance.now();
  let rem = Math.min((now - lastT) / 1000, 60);
  lastT = now;
  while (rem > 0) { const d = Math.min(rem, 0.05); update(d); rem -= d; }   // małe kroki = ta sama fizyka
}
function loop() {
  requestAnimationFrame(loop);
  advance();
  renderer.render(scene, camera);
  updateNameplate();
  renderAvatar();
  renderShop();
  renderCust();
  renderEmoteViews();
}
loop();
(function backgroundTicker() {
  const tick = () => { if (document.hidden) advance(); };
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),50)'], { type: 'text/javascript' })));
    w.onmessage = tick;
  } catch (err) { setInterval(tick, 250); }
})();
// po zmianie okna nie zostawiaj "wciśniętych" klawiszy (keyup nie dociera do ukrytej karty)
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
